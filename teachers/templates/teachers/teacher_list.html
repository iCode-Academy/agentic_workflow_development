<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Teachers</title>
</head>
<body>
  <h1>Teachers</h1>
  <ul>
    {% for teacher in teachers %}
      <li>
        {{ teacher.first_name }} {{ teacher.last_name }}
        &mdash; {{ teacher.subject }}
        ({{ teacher.email }})
      </li>
    {% empty %}
      <li>No teachers yet.</li>
    {% endfor %}
  </ul>
</body>
</html>
