<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Courses</title>
</head>
<body>
  <h1>Courses</h1>
  {% if courses %}
    <ul>
      {% for course in courses %}
        <li>{{ course }}</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No courses.</p>
  {% endif %}
</body>
</html>
