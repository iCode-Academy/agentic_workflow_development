{% extends 'base.html' %}

{% block title %}Students{% endblock %}

{% block content %}
  <h1>Students</h1>
  {% if students %}
    <ul>
      {% for student in students %}
        <li>{{ student }} &lt;{{ student.email }}&gt;</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>No active students.</p>
  {% endif %}
{% endblock %}
